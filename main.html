<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>

    <div class="container" style="width: 600px; max-width: 600px; border: 5px solid rgb(4, 255, 4); background-color: rgb(41, 0, 0);">
        
        <div class="row" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
            <div id="row1col1" class="col-md-4 col-sm-6" style="border: 2px dotted rgb(38, 38, 43); background-color: teal;">Row1 col1</div>
            <div id="row1col2" class="col-md-8 col-sm-6" style="border: 2px dotted rgb(38, 38, 43); background-color: thistle;">Row1 col2</div>
        </div>

        <div class="row" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
            <div id="row2col1" class="col-md-4 offset-md-2" style="border: 2px dotted rgb(38, 38, 43); background-color: tomato;">Row2 col1</div>
            <div id="row2col2" class="col-md-4" style="border: 2px dotted rgb(38, 38, 43); background-color: turquoise;">Row2 col2</div>
        </div>

        <div class="row justify-content-center" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
            <div id="row3col1" class="col-md-4 col-sm-6" style="border: 2px dotted rgb(38, 38, 43); background-color: violet;">Row3 col1</div>
            <div id="row3col2" class="col-md-4 col-sm-6" style="border: 2px dotted rgb(38, 38, 43); background-color: yellowgreen;">Row3 col2</div>
        </div>
        
    </div>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
